name: signasphere
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  go_router: ^17.1.0
  google_fonts: ^8.0.0
  flutter_animate: ^4.5.2
  phosphor_flutter: ^2.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  camera: ^0.11.3
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  audioplayers: ^6.5.1
  vibration: ^3.1.6
  url_launcher: ^6.3.1
  crypto: ^3.0.3
  http: ^1.2.0
  geolocator: ^13.0.1
  model_viewer_plus: ^1.7.0
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.jpeg"
  adaptive_icon_background: "#0F0F1E"
  adaptive_icon_foreground: "assets/logo.jpeg"

flutter:
  uses-material-design: true

  assets:
